<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="mintBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFEAE0"/>
      <stop offset="100%" stop-color="#5B91A3"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5B91A3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CFEAE0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g stroke="#5B91A3" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Browser/App Window Frame -->
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#091217" stroke="rgba(91, 145, 163, 0.4)" stroke-width="1.5"/>
  
  <!-- App Header / Toolbar -->
  <rect x="40" y="40" width="720" height="45" rx="16" fill="#0c171f"/>
  <rect x="40" y="70" width="720" height="15" fill="#0c171f"/>
  
  <!-- Window Controls -->
  <circle cx="65" cy="62" r="6" fill="#ff5f56"/>
  <circle cx="85" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="105" cy="62" r="6" fill="#27c93f"/>
  
  <text x="400" y="67" fill="#CFEAE0" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    E-COMMERCE MANAGEMENT SYSTEM • DASHBOARD
  </text>

  <!-- Left Sidebar -->
  <rect x="40" y="85" width="160" height="375" fill="#070e13"/>
  <rect x="55" y="110" width="130" height="28" rx="6" fill="rgba(91, 145, 163, 0.25)"/>
  <text x="75" y="128" fill="#CFEAE0" font-family="sans-serif" font-size="12" font-weight="bold">Products Catalog</text>
  <rect x="55" y="150" width="130" height="24" rx="6" fill="transparent"/>
  <text x="75" y="167" fill="#5B91A3" font-family="sans-serif" font-size="11">Inventory State</text>
  <rect x="55" y="185" width="130" height="24" rx="6" fill="transparent"/>
  <text x="75" y="202" fill="#5B91A3" font-family="sans-serif" font-size="11">Order Management</text>
  <rect x="55" y="220" width="130" height="24" rx="6" fill="transparent"/>
  <text x="75" y="237" fill="#5B91A3" font-family="sans-serif" font-size="11">Customer Logs</text>

  <!-- Metric Cards -->
  <rect x="220" y="105" width="160" height="80" rx="10" fill="#0f1d24" stroke="rgba(207, 234, 224, 0.2)" stroke-width="1"/>
  <text x="235" y="130" fill="#5B91A3" font-family="sans-serif" font-size="11">Total Sales</text>
  <text x="235" y="165" fill="#CFEAE0" font-family="sans-serif" font-size="22" font-weight="bold">$48,290</text>

  <rect x="400" y="105" width="160" height="80" rx="10" fill="#0f1d24" stroke="rgba(207, 234, 224, 0.2)" stroke-width="1"/>
  <text x="415" y="130" fill="#5B91A3" font-family="sans-serif" font-size="11">Active Orders</text>
  <text x="415" y="165" fill="#CFEAE0" font-family="sans-serif" font-size="22" font-weight="bold">142 Items</text>

  <rect x="580" y="105" width="160" height="80" rx="10" fill="#0f1d24" stroke="rgba(207, 234, 224, 0.2)" stroke-width="1"/>
  <text x="595" y="130" fill="#5B91A3" font-family="sans-serif" font-size="11">Inventory Health</text>
  <text x="595" y="165" fill="#CFEAE0" font-family="sans-serif" font-size="22" font-weight="bold">99.4%</text>

  <!-- Chart / Analytics Area -->
  <rect x="220" y="205" width="520" height="235" rx="12" fill="#081014" stroke="rgba(91, 145, 163, 0.3)" stroke-width="1"/>
  <text x="240" y="235" fill="#CFEAE0" font-family="sans-serif" font-size="13" font-weight="bold">Real-Time Inventory &amp; Revenue Analytics</text>

  <!-- Bars Chart -->
  <rect x="250" y="340" width="30" height="75" rx="4" fill="url(#barGrad)"/>
  <rect x="300" y="300" width="30" height="115" rx="4" fill="url(#barGrad)"/>
  <rect x="350" y="280" width="30" height="135" rx="4" fill="url(#barGrad)"/>
  <rect x="400" y="250" width="30" height="165" rx="4" fill="url(#barGrad)"/>
  <rect x="450" y="270" width="30" height="145" rx="4" fill="url(#barGrad)"/>
  <rect x="500" y="290" width="30" height="125" rx="4" fill="url(#barGrad)"/>
  <rect x="550" y="240" width="30" height="175" rx="4" fill="url(#barGrad)"/>
  <rect x="600" y="220" width="30" height="195" rx="4" fill="url(#barGrad)"/>
  <rect x="650" y="260" width="30" height="155" rx="4" fill="url(#barGrad)"/>

  <!-- Interactive line overlay -->
  <polyline points="265,330 315,290 365,270 415,235 465,255 515,275 565,225 615,205 665,245" 
            fill="none" stroke="#CFEAE0" stroke-width="3"/>
  <circle cx="615" cy="205" r="5" fill="#CFEAE0" stroke="#000000" stroke-width="2"/>
</svg>
